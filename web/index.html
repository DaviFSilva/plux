<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Plux — personal learning + knowledge platform">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Plux">

  <link rel="manifest" href="manifest.json">

  <title>Plux</title>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Unregister any service worker previously installed by older bundles.
       Flutter web ships flutter_service_worker.js by default; it caches
       index.html and main.dart.js for 1 year, which breaks the
       ?theme=<name> URL switcher because cached index.html loads the
       cached bundle regardless of the new URL. We don't need offline
       for a design-comparison screen. -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) {
          regs[i].unregister();
        }
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
