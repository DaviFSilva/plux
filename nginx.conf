server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health endpoint: returns a tiny static JSON so Railway can detect
    # "container alive and nginx serving" without false-positive from
    # the SPA index.html (which is always served regardless of app health).
    # Must come BEFORE the SPA fallback / location block.
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
        add_header Cache-Control "no-cache";
    }

    # Flutter web emits hashed asset filenames; cache them aggressively.
    # The entrypoint (index.html, flutter_bootstrap.js) must NOT be cached
    # because it carries the version hash and may change between deploys.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: send everything else to index.html so Flutter Router handles it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # gzip Flutter's already-minified JS for extra wins.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}