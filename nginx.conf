server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter web emits hashed asset filenames; cache them aggressively.
    # The entrypoint (index.html, flutter_bootstrap.js) must NOT be cached
    # because it carries the version hash and may change between deploys.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: send everything else to index.html so Flutter Router handles it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # gzip Flutter's already-minified JS for extra wins.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}