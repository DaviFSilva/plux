# Railway build config. Use the Dockerfile in this directory.
# See https://docs.railway.com/reference/dockerfile-deploys
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects $PORT. Our nginx config listens on 8080; we map it.
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3