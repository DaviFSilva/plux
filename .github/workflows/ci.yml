name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel in-progress runs for the same branch on new pushes — saves CI minutes
# when you push a fix before the previous run finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job runs analyze + test in sequence. They're both fast (~10s each)
  # and share the same pub cache, so splitting them into parallel jobs costs
  # more in cache-thrash than it saves in wall time.
  verify:
    name: Analyze + Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true  # caches pub get automatically between runs

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # Separate job for the release build because it's slow (~40s locally, often
  # longer on cold CI cache) and runs on a different runner to not block the
  # fast gate. Catches Dockerfile-relevant issues before Railway does.
  build:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plux-web-${{ github.sha }}
          path: build/web/
          retention-days: 7
          if-no-files-found: error